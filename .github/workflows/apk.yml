name: APK 만들기

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: zip 풀기
        run: |
          Z=$(ls *.zip | head -n 1)
          echo "압축 파일: $Z"
          mkdir app && unzip -q "$Z" -d app

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 안드로이드 도구 준비
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: 빌드
        working-directory: app
        run: |
          npm ci
          npx cap sync android
          cd android
          sed -i -E 's/^( *)versionCode .*/\1versionCode ${{ github.run_number }}/' app/build.gradle
          sed -i -E 's/^( *)versionName .*/\1versionName "1.0.${{ github.run_number }}"/' app/build.gradle
          grep -n "version" app/build.gradle
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../논문작성안내-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: 논문작성안내-*.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 논문 작성 안내 앱 1.0.${{ github.run_number }}
          body: 휴대폰에서 아래 APK 파일을 눌러 받아 설치하세요.
          files: 논문작성안내-*.apk
          make_latest: true
